<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e5c64"/>
      <stop offset="1" stop-color="#3d3846"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2a55"/>
      <stop offset="1" stop-color="#1a5fb4"/>
    </linearGradient>
    <radialGradient id="knob" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#deddda"/>
      <stop offset="1" stop-color="#9a9996"/>
    </radialGradient>
    <linearGradient id="knobedge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c0bfbc"/>
      <stop offset="1" stop-color="#77767b"/>
    </linearGradient>
  </defs>
  <!-- front profile (darker base, 4 px) -->
  <rect x="8" y="30" width="112" height="76" rx="14" fill="#241f31"/>
  <!-- body -->
  <rect x="8" y="26" width="112" height="76" rx="14" fill="url(#body)"/>
  <rect x="9" y="27" width="110" height="74" rx="13" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <!-- display -->
  <rect x="18" y="36" width="60" height="44" rx="6" fill="url(#screen)"/>
  <!-- waterfall streaks -->
  <rect x="28" y="44" width="3" height="30" rx="1.5" fill="#99c1f1" opacity="0.9"/>
  <rect x="40" y="52" width="3" height="22" rx="1.5" fill="#ffffff" opacity="0.95"/>
  <rect x="52" y="47" width="3" height="27" rx="1.5" fill="#62a0ea" opacity="0.85"/>
  <rect x="63" y="58" width="3" height="16" rx="1.5" fill="#99c1f1" opacity="0.8"/>
  <!-- spectrum trace -->
  <path d="M22 42 L30 41 L33 38 L36 41 L41 40 L44 37.5 L47 40.5 L53 39 L56 38 L59 41 L70 41 L74 40.5" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- small keys -->
  <rect x="18" y="86" width="12" height="7" rx="3.5" fill="#241f31" opacity="0.55"/>
  <rect x="34" y="86" width="12" height="7" rx="3.5" fill="#241f31" opacity="0.55"/>
  <rect x="50" y="86" width="12" height="7" rx="3.5" fill="#241f31" opacity="0.55"/>
  <rect x="66" y="86" width="12" height="7" rx="3.5" fill="#e66100"/>
  <!-- tuning knob -->
  <circle cx="98" cy="62" r="18" fill="url(#knobedge)"/>
  <circle cx="98" cy="61" r="16" fill="url(#knob)"/>
  <circle cx="104" cy="52" r="3" fill="#e66100"/>
</svg>
